<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOXO — Real-time Collaborative Editor</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/YOCRRZ224/Doxo/refs/heads/main/static/fav.png">

<style>
/* ---------- GLOBAL ---------- */
body {
  margin:0;
  font-family: monospace;
  background:#f4f4f4;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow-x:hidden;
}

a { text-decoration:none; }

/* ---------- CONTAINER ---------- */
.landing-container {
  background:white;
  border:4px solid black;
  box-shadow:4px 4px 0 black;
  padding:40px 30px;
  max-width:600px;
  text-align:center;
  position:relative;
  overflow:hidden;
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: scale(0.95); opacity:0; }
  100% { transform: scale(1); opacity:1; }
}

/* ---------- LOGO ---------- */
.logo {
  width:100px;
  height:100px;
  object-fit: contain;
  border:2px solid black;
  box-shadow:2px 2px 0 black;
  border-radius:8px;
  margin:0 auto 20px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* ---------- TITLE ---------- */
h1 {
  font-size:28px;
  margin:0 0 10px;
}

h2 {
  font-size:18px;
  margin:0 0 30px;
  font-weight:normal;
  color:#333;
}

/* ---------- BUTTONS ---------- */
.button {
  display:inline-block;
  background:white;
  color:black;
  padding:10px 20px;
  margin:5px;
  border:2px solid black;
  box-shadow:2px 2px 0 black;
  cursor:pointer;
  font-family: monospace;
  font-size:14px;
  transition: all 0.1s ease;
}

.button:hover {
  transform: scale(1.05);
}

.button:active {
  transform: translate(2px,2px);
  box-shadow:0 0 0 black;
}

.button.danger {
  background:red;
  color:white;
}

.button.danger:hover {
  background:#ff4c4c;
}

/* ---------- FEATURES ---------- */
.features {
  text-align:left;
  margin-top:30px;
}

.feature {
  margin-bottom:15px;
  border:2px solid black;
  padding:10px;
  box-shadow:2px 2px 0 black;
  transition: all 0.2s ease;
}

.feature:hover {
  transform: translateY(-3px);
}

/* ---------- FOOTER ---------- */
footer {
  margin-top:30px;
  font-size:12px;
  color:#555;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:500px){
  .landing-container { padding:30px 20px; }
  h1 { font-size:24px; }
  h2 { font-size:16px; }
  .button { padding:8px 16px; font-size:13px; }
}
</style>
</head>
<body>

<div class="landing-container">
  <img src="https://raw.githubusercontent.com/YOCRRZ224/Doxo/refs/heads/main/static/fav.png" alt="DOXO Logo" class="logo">
  
  <h1>DOXO</h1>
  <h2>Real-time Collaborative Editor with Live Cursors, Chat, and Rooms</h2>
  
  <div>
    <a href="https://github.com/YOCRRZ224/Doxo" target="_blank" class="button">View on GitHub</a>
    <a href="/" class="button">Go to Editor</a>
  </div>
  
  <div class="features">
    <div class="feature">💬 Live Chat & Collaboration</div>
    <div class="feature">🚀 Fast Real-time Editing</div>
    <div class="feature">🔒 Rooms with Passwords</div>
    <div class="feature">🤖 Integrated AI Assistant</div>
  </div>
</div>

<footer>
  &copy; 2026 DOXO • Designed by YOCRRZ
</footer>

</body>
</html>
